# doctl serverless deploy bot   (from the repo root; secrets come from bot/.env, see .env.example)
packages:
  - name: default
    functions:
      - name: driver_bot
        runtime: nodejs:24
        web: raw
        limits:
          timeout: 180000 # the news job: a reasoning model, then one message per subscriber
          memory: 256
        environment:
          TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN}"
          TELEGRAM_WEBHOOK_SECRET: "${TELEGRAM_WEBHOOK_SECRET}"
          GITHUB_TOKEN: "${GITHUB_TOKEN}"
          GITHUB_WEBHOOK_SECRET: "${GITHUB_WEBHOOK_SECRET}"
          GITHUB_REPO: "${GITHUB_REPO}"
          TYPESAFE_API_KEY: "${TYPESAFE_API_KEY}"
          SPACES_KEY: "${SPACES_KEY}"
          SPACES_SECRET: "${SPACES_SECRET}"
          SPACES_BUCKET: "${SPACES_BUCKET}"
          SPACES_REGION: "${SPACES_REGION}"
          ADMIN_CHAT_ID: "${ADMIN_CHAT_ID}"
          DARKBLOOM_API_KEY: "${DARKBLOOM_API_KEY}"
          DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY}"
          OPENAI_API_KEY: "${OPENAI_API_KEY}"
        triggers: # the daily news (news.js) at 21:00 Kyiv: the cron is UTC, 18:00 in summer and 19:00 in winter, so it fires
                  # at both and only the run that lands on 21:00 Kyiv does the work; the other returns at once
          - name: daily-news
            sourceType: scheduler
            sourceDetails:
              cron: "0 18,19 * * *"
              withBody:
                job: news
